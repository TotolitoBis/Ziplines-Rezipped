name: Compiler Ziplines corrige

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: Version de Minecraft (Fabric)
        required: true
        default: '26.3'
        type: choice
        options:
          - '26.3'
          - '26.2'

jobs:
  compiler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Recuperer le patch
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Recuperer le code du mod
        run: git clone --depth 1 --branch stonecutter https://github.com/evanbones/Ziplines-Rezipped.git ziplines-source

      - name: Appliquer le correctif des mains
        working-directory: ziplines-source
        run: |
          git apply --check ../fix-ziplines-hand-animation.patch
          git apply ../fix-ziplines-hand-animation.patch

      - name: Compiler le mod Fabric
        working-directory: ziplines-source
        env:
          MC_VERSION: ${{ inputs.minecraft_version }}
        run: |
          chmod +x gradlew
          ./gradlew ":${MC_VERSION}-fabric:build" --no-daemon

      - name: Selectionner le JAR installable
        env:
          MC_VERSION: ${{ inputs.minecraft_version }}
        run: |
          set -euo pipefail
          libdir="ziplines-source/versions/${MC_VERSION}-fabric/build/libs"
          test -d "$libdir"
          jar=$(find "$libdir" -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' ! -name '*-dev*' -print -quit)
          test -n "$jar" || { echo 'ERREUR: aucun .jar installable trouve'; exit 1; }
          mkdir -p resultat
          cp "$jar" "resultat/ziplines-corrige-${MC_VERSION}-fabric.jar"
          echo "JAR retenu : $jar"

      - name: Permettre le telechargement du JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ziplines-corrige-${{ inputs.minecraft_version }}-Fabric
          path: resultat/*.jar
          if-no-files-found: error
